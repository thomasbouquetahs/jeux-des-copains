<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1c2a">
<title>Les Camemberts · Manette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0e1c2a; --surface:#162a3e; --surface2:#1e3650; --line:#2b4866;
  --ink:#eef3f8; --muted:#97adc2; --gold:#f2c230;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem}
.brand svg{width:34px;height:34px}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:#ff8a7a}
.status.on i{background:#4fd18a}
.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{margin:0;line-height:1.4}
.muted{color:var(--muted)}
.btn{padding:16px 18px;border-radius:14px;font-weight:700;font-family:var(--display);font-size:1.15rem;width:100%}
.btn-main{background:var(--gold);color:#1d1600}
.btn-ghost{background:var(--surface2);border:2px solid var(--line)}
.btn-small{padding:9px 12px;border-radius:10px;font-size:.85rem;background:var(--surface);color:var(--muted);width:auto;font-family:var(--body)}
.btn-small.armed{background:#7a2131;color:#fff}
.chips{display:flex;gap:8px}
.chip{flex:1;padding:12px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--gold)}
.name-row{display:flex;align-items:center;gap:12px}
.name-row input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit}
.pawn{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#10202f;border:2px solid rgba(255,255,255,.7)}
.turn{display:flex;align-items:center;gap:12px}
.turn strong{font-family:var(--display);font-size:1.5rem;display:block;line-height:1.1}
.turn span{color:var(--muted);font-size:.85rem}
.dir,.cat{display:flex;align-items:center;gap:10px;padding:15px 14px;border-radius:14px;background:var(--surface2);text-align:left;font-weight:700;width:100%}
.sw{width:18px;height:18px;border-radius:5px;flex:none}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{justify-content:flex-start}
.card{background:#f8f4ea;color:#17212b;border-radius:20px;overflow:hidden}
.card-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700}
.card-head em{font-style:normal;font-size:.8rem;font-family:var(--body);opacity:.85}
.card-body{padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
.q{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.25;margin:0;text-wrap:balance}
.ans{background:#ebe3d0;border-radius:14px;padding:14px;font-size:1.1rem;font-weight:700}
.ans small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#6b6352;margin-bottom:4px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok{background:#2f8f4e;color:#fff}.ko{background:#b23a48;color:#fff}
.dark-btn{background:#17212b;color:#f8f4ea}
.scores{display:flex;gap:6px}
.score{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;font-size:.78rem;color:var(--muted)}
.score.cur{background:var(--surface);color:var(--ink)}
.score svg{width:38px;height:38px}
.score .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.die{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#f6f1e6;color:#1b2633;font-weight:800;font-family:var(--display);font-size:1.4rem;box-shadow:0 3px 0 #b9ad95;flex:none}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.row{display:flex;gap:12px;align-items:center}
.center{text-align:center;align-items:center}
.big-ico{font-size:3rem;line-height:1}
/* cartes joueurs (choix d'identité, salon) */
.who{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface2);border:2px solid var(--line);text-align:left;width:100%}
.pl .pawn{width:34px;height:34px;font-size:.95rem}
.pl .nm{flex:1;min-width:0;font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .st{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:#4fd18a;flex:none}
.dot.off{background:#5d7690}
.pl.free{border-color:var(--gold)}
.pl.free .st{color:var(--gold);font-weight:700}
.pl.busy{opacity:.6}
.pl.me{border-color:#4fd18a;background:#1d3d40}
.pl.ask{border-color:#ff8a7a}
.hint{font-size:.85rem;color:var(--muted);margin:0;line-height:1.4}
.score .on{width:7px;height:7px;border-radius:50%;background:#4fd18a;display:inline-block;margin-right:3px;vertical-align:1px}
/* bandeau hors ligne */
.offbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#7a2131;color:#fff;text-align:center;font-weight:700;z-index:10}
body.off #app{opacity:.45;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand"><svg viewBox="-50 -50 100 100" id="logo" aria-hidden="true"></svg>Manette</div>
    <div class="status" id="status"><i></i><span>Connexion…</span></div>
  </div>
  <div id="app"></div>
</div>
<div class="offbar" id="offbar" hidden>Connexion à la TV perdue, reconnexion…</div>

<script src="vendor/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLS=['#2f7fd8','#e05a9b','#f2c230','#9a6234','#36a457','#f08a24'];
const PCOL=['#f5efe2','#b79cff','#4fd1c5','#ff8a7a'];
function wedge(r,k){const a0=-90+k*60,a1=a0+60,t0=a0*Math.PI/180,t1=a1*Math.PI/180;
  return `M0 0L${(r*Math.cos(t0)).toFixed(2)} ${(r*Math.sin(t0)).toFixed(2)}A${r} ${r} 0 0 1 ${(r*Math.cos(t1)).toFixed(2)} ${(r*Math.sin(t1)).toFixed(2)}Z`;}
function pie(w,r=46){let s=`<circle r="${r+2}" fill="#0b1724" stroke="#3a5978" stroke-width="2"/>`;
  for(let k=0;k<6;k++)s+=`<path d="${wedge(r,k)}" fill="${w[k]?COLS[k]:'#203a55'}" stroke="#0b1724" stroke-width="2.5"/>`;return s;}
const pieSvg=w=>`<svg viewBox="-50 -50 100 100" aria-hidden="true">${pie(w)}</svg>`;
$('logo').innerHTML=pie([1,1,1,1,1,1]);

const code=(new URLSearchParams(location.search).get('r')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
let pid=LS.get('camemberts-pid');if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);LS.set('camemberts-pid',pid);}
let peer=null,conn=null,V=null,retry=0,armT=null,watch=false,lastMsg=0,live=false,askK=-1,askT=null;

/* ---------- connexion ---------- */
function setStatus(on,txt){$('status').className='status'+(on?' on':'');$('status').querySelector('span').textContent=txt;}
function setLive(on){live=on;document.body.classList.toggle('off',!on&&!!V);$('offbar').hidden=on||!V;}
function act(a,extra){if(!live||!conn||!conn.open){setLive(false);reconnect();return}
  try{conn.send(Object.assign({t:'act',a},extra||{}))}catch(e){}
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}

function connect(){
  if(!code){$('app').innerHTML=`<div class="panel"><p class="msg">Lien incomplet. Scannez à nouveau le QR code affiché sur la TV.</p></div>`;setStatus(false,'Pas de partie');return;}
  if(typeof Peer==='undefined'){$('app').innerHTML=`<div class="panel"><p class="msg">Impossible de charger la manette. Vérifiez la connexion internet puis rechargez la page.</p></div>`;return;}
  setStatus(false,'Connexion…');
  if(!peer||peer.destroyed){
    peer=new Peer({debug:0});
    peer.on('open',()=>openConn());
    peer.on('disconnected',()=>setTimeout(()=>{try{if(peer.disconnected&&!peer.destroyed)peer.reconnect()}catch(e){}},1000));
    peer.on('error',err=>{const t=err&&err.type;
      if(t==='peer-unavailable'){setStatus(false,'TV injoignable');
        if(!V)$('app').innerHTML=`<div class="panel"><p class="msg">La TV (code <b>${esc(code)}</b>) ne répond pas.</p><p class="hint">Vérifiez que la page du jeu est ouverte sur la TV et que le code affiché est bien <b>${esc(code)}</b>. Nouvel essai automatique…</p></div>`;
        later();return;}
      if(peer.destroyed)later();
    });
  }else if(peer.open)openConn();
  else if(peer.disconnected){try{peer.reconnect()}catch(e){}}
}
let laterT=null;
function later(){clearTimeout(laterT);laterT=setTimeout(()=>{if(!live)reconnect()},Math.min(8000,1200*(++retry)));}
function reconnect(){if(peer&&peer.open)openConn();else connect();}
function openConn(){
  try{conn&&conn.close()}catch(e){}
  const c=peer.connect('camemberts-'+code,{reliable:true});conn=c;
  c.on('open',()=>{if(conn!==c)return;retry=0;lastMsg=Date.now();setLive(true);setStatus(true,'Connecté · '+code);
    try{c.send({t:'hello',pid,name:LS.get('camemberts-name')})}catch(e){}});
  c.on('data',m=>{if(conn!==c)return;lastMsg=Date.now();if(!live){setLive(true);setStatus(true,'Connecté · '+code);}
    if(m&&m.t==='state'){V=m.v;render();}});
  const lost=()=>{if(conn!==c)return;setLive(false);setStatus(false,'Reconnexion…');later();};
  c.on('close',lost);c.on('error',lost);
}
/* battement de cœur : on vérifie toutes les 3 s que la TV répond */
setInterval(()=>{
  if(conn&&conn.open){try{conn.send({t:'ping'})}catch(e){}}
  if(live&&Date.now()-lastMsg>9000){setLive(false);setStatus(false,'Reconnexion…');reconnect();}
},3000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){lastMsg=lastMsg||Date.now();if(!live||Date.now()-lastMsg>5000)reconnect();}});

/* ---------- affichage ---------- */
const wait=t=>`<p class="msg muted">${t}</p>`;
function scoresHtml(){return `<div class="scores">${V.players.map((q,k)=>`<div class="score${k===V.cur?' cur':''}">${pieSvg(q.wedges)}<span class="nm">${q.online||k===V.me?'<i class="on"></i>':''}${esc(q.name)}</span></div>`).join('')}</div>`;}

function render(){
  const app=$('app');
  if(!V)return;
  setLive(live);
  if(V.mode==='setup'){const ae=document.activeElement;
    const key=JSON.stringify([V.lobby,V.me,V.resume]);
    if(ae&&ae.matches&&ae.matches('#app input')&&app.dataset.key===key)return;
    app.dataset.key=key;return renderSetup(app);}
  app.dataset.key='';
  if(V.me<0&&!watch)return renderWho(app);
  watch=V.me<0&&watch;
  const p=V.players[V.cur],me=V.me,mine=me===V.cur;
  let h='';
  if(me>=0)h+=`<div class="turn"><div class="pawn" style="background:${V.players[me].color}">${me+1}</div><div><span>Tu joues</span><strong>${esc(V.players[me].name)}</strong></div></div>`;
  else h+=`<div class="turn"><div><span>Spectateur</span><strong>Au tour de ${esc(p.name)}</strong></div></div>`;
  h+=scoresHtml();
  let body='';
  const turnTitle=mine?`<p class="msg"><b>C'est ton tour !</b></p>`:`<p class="msg"><b>Au tour de ${esc(p.name)}</b></p>`;
  if(V.phase!=='question'&&V.phase!=='win'){body+=turnTitle;if(V.msg)body+=`<p class="msg muted">${esc(V.msg)}</p>`;}
  if(V.phase==='roll'){
    if(V.rolling)body+=`<div class="row"><span class="die rolling">?</span><span class="muted">Le dé roule…</span></div>`;
    else if(V.canPlay)body+=`<button class="btn btn-main" data-a="roll">🎲 Lancer le dé${mine?'':' pour '+esc(p.name)}</button>`;
    else body+=wait(`${esc(p.name)} lance le dé…`);
  }
  if(V.phase==='choose'){
    body+=`<div class="row"><span class="die">${V.roll}</span><span class="muted">${V.canPlay?(mine?'Choisis ta case':'Choisis la case de '+esc(p.name)):esc(p.name)+' choisit sa case…'}</span></div>`;
    if(V.canPlay)body+=V.options.map(o=>`<button class="dir" data-a="go" data-i="${o.i}"><span class="sw" style="background:${o.c}"></span><span>${o.dir?o.dir+' ':''}${esc(o.t)}</span></button>`).join('');
  }
  if(V.phase==='final'){
    if(V.canJudge){body+=`<p class="msg"><b>Question finale de ${esc(p.name)}.</b> Choisissez sa catégorie :</p>`;
      body+=`<div class="cats">${V.cats.map((c,k)=>`<button class="cat" data-a="fc" data-k="${k}" style="background:${c.color};color:${c.ink}">${esc(c.name)}</button>`).join('')}</div>`;}
    else body+=wait(mine?'Question finale ! Tes adversaires choisissent ta catégorie…':`Les adversaires de ${esc(p.name)} choisissent la catégorie…`);
  }
  let main=`<div class="panel">${body}</div>`;
  if(V.phase==='question'&&V.q){const q=V.q;let foot;
    if(mine)foot=`<div class="ans" style="background:#f2c230"><small style="color:#5a4700">À toi</small>Réponds à voix haute !</div>`;
    else if(V.canJudge)foot=q.shown?`<div class="ans"><small>Réponse</small>${esc(q.answer)}</div><div class="judge"><button class="btn ok" data-a="ok">Bonne réponse</button><button class="btn ko" data-a="ko">Raté</button></div>`
        :`<button class="btn dark-btn" data-a="show">Voir la réponse</button>`;
    else foot=`<p class="msg" style="color:#6b6352">${esc(p.name)} répond…</p>`;
    if(mine&&V.canJudge)foot+=`<p class="hint" style="color:#6b6352">Personne d'autre n'a de téléphone : un autre joueur peut juger depuis le tien.</p>`+(q.shown?`<div class="judge"><button class="btn ok" data-a="ok">Bonne réponse</button><button class="btn ko" data-a="ko">Raté</button></div>`:`<button class="btn dark-btn" data-a="show">Voir la réponse (pour l'arbitre)</button>`);
    main=`<div class="card"><div class="card-head" style="background:${q.color};color:${q.ink}"><span>${esc(q.cat)}</span><em>${esc(q.tag)}</em></div><div class="card-body">
      ${mine?'':`<span style="font-size:.8rem;color:#6b6352;font-weight:700">Question pour ${esc(p.name)}</span>`}<p class="q">${esc(q.text)}</p>${foot}</div></div>`;
  }
  if(V.phase==='win'){
    main=`<div class="card"><div class="card-head" style="background:var(--gold);color:#1d1600;justify-content:center"><span>Victoire</span></div><div class="card-body center">
      <div style="width:120px;height:120px">${pieSvg(V.players[V.cur].wedges)}</div><p class="q">${mine?'Bravo, tu remportes la partie !':esc(V.winner)+' remporte la partie !'}</p>
      <button class="btn dark-btn" data-a="again">Nouvelle partie</button></div></div>`;
  }
  h+=main;
  h+=`<div class="row" style="justify-content:space-between"><button class="btn-small" id="who">${me>=0?'Changer de joueur':'Choisir mon joueur'}</button>${V.phase!=='win'?'<button class="btn-small" id="newg">Nouvelle partie</button>':''}</div>`;
  app.innerHTML=h;
  $('who').onclick=()=>{watch=false;if(me>=0)act('unbind');else render();};
  const ng=$('newg');if(ng)ng.onclick=function(){
    if(this.classList.contains('armed')){clearTimeout(armT);act('newgame');return}
    this.classList.add('armed');this.textContent='Confirmer ?';armT=setTimeout(()=>{this.classList.remove('armed');this.textContent='Nouvelle partie'},3000);};
}

/* « Qui es-tu ? » en cours de partie : libres en avant, déjà pris en retrait */
function renderWho(app){
  const free=V.players.filter(q=>!q.online).length;
  let h=`<div class="panel"><span class="label">Partie en cours</span><p class="q" style="margin:0">Qui es-tu ?</p>
    <p class="hint">${free?'Touche ton prénom.':'Tous les joueurs ont déjà un téléphone. Touche un prénom pour prendre sa place.'}</p><div class="who">`;
  const order=V.players.map((q,k)=>k).sort((a,b)=>(V.players[a].online-V.players[b].online)||a-b);
  h+=order.map(k=>{const q=V.players[k],asking=askK===k;
    const st=q.online?(asking?'Toucher à nouveau pour confirmer':'<i class="dot"></i>Connecté ailleurs'):'Libre · c’est moi';
    return `<button class="pl ${q.online?(asking?'ask':'busy'):'free'}" data-who="${k}"><span class="pawn" style="background:${q.color}">${k+1}</span><span class="nm">${esc(q.name)}</span><span class="st">${st}</span></button>`;}).join('');
  h+=`</div></div><button class="btn btn-ghost" id="watch">Juste regarder</button>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{const k=+b.dataset.who,q=V.players[k];
    if(q.online&&askK!==k){askK=k;clearTimeout(askT);askT=setTimeout(()=>{askK=-1;render()},4000);render();return;}
    askK=-1;b.classList.remove('free','busy','ask');b.classList.add('me');b.querySelector('.st').textContent='Connexion…';act('iam',{k});});
  $('watch').onclick=()=>{watch=true;render();};
}

/* salon avant la partie */
function renderSetup(app){
  const me=V.me,n=V.lobby.length;
  let h='';
  if(me<0){
    h+=`<div class="panel"><span class="label">Nouvelle partie</span><p class="q" style="margin:0">Qui es-tu ?</p>`;
    if(n<4)h+=`<p class="hint">Entre ton prénom pour rejoindre la partie sur la TV.</p><div class="name-row"><div class="pawn" style="background:${PCOL[n]}">${n+1}</div><input id="myname" maxlength="14" placeholder="Ton prénom" value="${esc(LS.get('camemberts-name'))}" autocomplete="off" enterkeyhint="go"></div><button class="btn btn-main" id="join">Rejoindre la partie</button>`;
    else h+=wait('La partie est complète (4 joueurs).');
    h+=`</div>`;
  }
  h+=`<div class="panel"><span class="label">Joueurs (${n}/4)</span><div class="who">`;
  for(let k=0;k<4;k++){const l=V.lobby[k];
    if(l)h+=`<div class="pl${k===me?' me':''}"><span class="pawn" style="background:${PCOL[k]}">${k+1}</span><span class="nm">${esc(l.name)}${k===me?' <span class="muted" style="font-weight:400">(toi)</span>':''}</span><span class="st"><i class="dot${l.online?'':' off'}"></i>${l.online?'Prêt':'Déconnecté'}</span></div>`;
    else h+=`<div class="pl" style="border-style:dashed;opacity:.5"><span class="pawn" style="background:${PCOL[k]}">${k+1}</span><span class="nm muted" style="font-weight:400">Place libre</span></div>`;}
  h+=`</div>`;
  if(me>=0){h+=n>=2?`<button class="btn btn-main" data-a="start">Lancer la partie à ${n}</button>`:wait('En attente d’au moins un autre joueur… Faites-lui scanner le QR code de la TV.');
    h+=`<button class="btn-small" id="leave" style="align-self:flex-start">Changer de prénom</button>`;}
  h+=`</div>`;
  if(V.resume)h+=`<div class="panel"><span class="label">Partie sauvegardée</span><p class="msg muted">${esc(V.resume.join(', '))}</p><button class="btn btn-ghost" data-a="resume">Reprendre cette partie</button></div>`;
  app.innerHTML=h;
  const j=$('join');if(j){const go=()=>{const v=$('myname').value.trim();if(!v){$('myname').focus();return}LS.set('camemberts-name',v);$('myname').blur();act('join',{name:v});};
    j.onclick=go;$('myname').addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
